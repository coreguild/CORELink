name: release
# Manual button in the Actions tab: Actions -> release -> Run workflow -> pick the branch.
# Version numbers are automatic: computed from existing tags (see scripts/release.sh header).
# channel=rc    on a release/* branch only: release/0.2.0 -> v0.2.0-rcN; release/<name> -> next rc of the open
#               series, else bump the last release and start rc1. Refused on main.
# channel=final on main only: promotes the rc merged into main (addon files must match) to v<ver>; latest release
# channel=site  on main: only re-renders the download page
# rc and final also upload the zip to CurseForge (beta / release) when the CURSEFORGE_API_KEY secret and the
# CURSEFORGE_PROJECT_ID variable are set in Settings -> Secrets and variables -> Actions.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: "rc = release candidate, final = promote to stable, site = re-render page only"
        type: choice
        required: true
        default: rc
        options: [rc, final, site]
      bump:
        description: "rc only: auto = continue the open rc series or patch-bump the last release; minor/major start a new series"
        type: choice
        default: auto
        options: [auto, patch, minor, major]
      notes:
        description: "Extra text on top of the notes built from the commits since the last release"
        type: string
        required: false
      no_rc:
        description: "final only: allow a release without an rc tag (small hotfix, no relay/protocol change)"
        type: boolean
        default: false
permissions:
  contents: write     # tags, releases, gh-pages
jobs:
  release:
    name: ${{ inputs.channel }}
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')
    concurrency: release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Install Lua and luacheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.4 lua-check
      - name: Release
        env:                      # inputs go through env vars, never interpolated into the shell
          GH_TOKEN: ${{ github.token }}
          LUA: lua5.4
          LUAC: luac5.4
          CI: "true"
          CHANNEL: ${{ inputs.channel }}
          BUMP: ${{ inputs.bump }}
          NOTES: ${{ inputs.notes }}
          NO_RC: ${{ inputs.no_rc }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          args=("$CHANNEL" --bump "${BUMP:-auto}")
          [ -n "$NOTES" ] && args+=(--notes "$NOTES")
          [ "$NO_RC" = "true" ] && args+=(--no-rc)
          scripts/release.sh "${args[@]}"
      - name: Upload to CurseForge
        if: inputs.channel != 'site'
        env:                      # rc -> beta file, final -> release file; skipped when the secret or the id is unset
          GH_TOKEN: ${{ github.token }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          CURSEFORGE_GAME_VERSIONS: ${{ vars.CURSEFORGE_GAME_VERSIONS }}
        run: scripts/curseforge-upload.sh
      - name: Summary
        if: always()
        run: |
          {
            echo "### Release: ${{ inputs.channel }}"
            echo "- Page: https://coreguild.github.io/CORELink/"
            echo "- Stable: https://coreguild.github.io/CORELink/latest/CORELink.zip"
            echo "- RC: https://coreguild.github.io/CORELink/rc/CORELink.zip"
          } >> "$GITHUB_STEP_SUMMARY"
