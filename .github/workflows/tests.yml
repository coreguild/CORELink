name: tests
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours: catch a game patch that changes the interface number
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # tests/mutation.sh diffs against the base branch
      - name: Install Lua and luacheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.4 lua-check
      - name: Syntax check, luacheck and mock harness
        env:
          LUA: lua5.4
          LUAC: luac5.4
        run: tests/run.sh
      - name: New harness checks fail without the change
        if: github.event_name == 'pull_request'
        env:
          LUA: lua5.4
          LUAC: luac5.4
          BASE: origin/${{ github.base_ref }}
          MUTATION_EXEMPT: ${{ startsWith(github.event.pull_request.title, 'refactor') }}
        run: tests/mutation.sh "$BASE"
      - name: TOCs carry the version placeholder
        run: |
          for t in CORELink/*.toc; do
            grep -q '^## Version: @project-version@$' "$t" || { echo "$t must say '## Version: @project-version@'; versions are stamped at release time"; exit 1; }
          done
      - name: Package builds with a stamped version
        env:
          LUA: lua5.4
          LUAC: luac5.4
          VERSION: 0.0.0-ci
        run: |
          scripts/package.sh >/dev/null
          unzip -p dist/CORELink-0.0.0-ci.zip CORELink/CORELink.toc | grep -q '^## Version: 0.0.0-ci$' && echo "stamping ok"
  game-version:
    name: game-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write          # this job only: the scheduled run opens an issue when the game moved ahead of us
    steps:
      - uses: actions/checkout@v4
      - name: TOC interface matches the live client
        id: check
        shell: bash
        # The script's exit code decides, not tee's. 1: a TOC does not list the live interface. 2: the version
        # file could not be read. On a pull request an unreachable server is a warning (--outage-ok); the
        # scheduled run fails on it, so a lookup that stays broken is noticed.
        run: |
          flag=--outage-ok
          [ "${{ github.event_name }}" = "schedule" ] && flag=
          set +e
          scripts/check-game-version.sh $flag | tee check.txt
          status=${PIPESTATUS[0]}
          [ "$status" -eq 1 ] && echo "mismatch=true" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Open an issue when the game moved ahead of us (scheduled runs only)
        if: failure() && github.event_name == 'schedule' && steps.check.outputs.mismatch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Game client updated: TOC interface no longer matches"
          if [ -z "$(gh issue list --state open --search "\"$title\" in:title" --json number -q '.[0].number')" ]; then
            gh issue create --title "$title" --label "game-patch" --body "$(printf 'scripts/check-game-version.sh failed on the scheduled run:\n\n```\n%s\n```\n\nOpen a `chore/interface-bump` PR updating `## Interface:` in both TOCs, re-test in game, and bump the addon version.' "$(cat check.txt)")"
          fi
